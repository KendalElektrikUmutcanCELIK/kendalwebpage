name: Build and deploy to cPanel

on:
  # Otomatik push tetikleyicisi GEÇİCİ OLARAK KAPALI (2026-09-15) — kendalelektrik.com.tr
  # gerçek canlı OpenCart sitesinin üzerine erken/yanlışlıkla yazılmaması için. Şimdilik
  # kendalelektrik.com (test/deneme alanı, deploy-test-kendalelektrikcom.yml) üzerinde
  # çalışılıyor. cPanel'e gerçekten geçmeye hazır olunca aşağıdaki "push:" bloğunu
  # tekrar aç (silinmedi, sadece yorum satırına alındı).
  # push:
  #   branches: ["main"]
  #   paths:
  #     - "src/**"
  #     - "public/**"
  #     - "package.json"
  #     - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: "cpanel-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (production/cPanel mode)
        run: npm run build

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
